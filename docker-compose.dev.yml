# ==============================================================================
# DOCKER COMPOSE - ENTORNO DE DESARROLLO ACTIVO (HOT RELOAD)
# ==============================================================================
# Uso: docker compose -f docker-compose.dev.yml up --build
# Propósito: Permite desarrollar en vivo con recarga automática (HMR) tanto en
# el backend NestJS como en el frontend React Vite mediante volúmenes enlazados.
# ==============================================================================

name: comercial360-dev

services:

  # ==========================================================
  # 1. BASE DE DATOS POSTGRESQL (DESARROLLO LOCAL)
  # ==========================================================
  postgres:
    image: postgres:16-alpine
    container_name: comercial360-dev-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./docker:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${DB_NAME:-comercial360_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-comercial360_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev-network

  # ==========================================================
  # 2. ALMACENAMIENTO S3 LOCAL (MINIO)
  # ==========================================================
  minio:
    image: minio/minio:latest
    container_name: comercial360-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Consola Web MinIO
    volumes:
      - miniodata_dev:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev-network

  # Inicializador automático del bucket privado en MinIO
  minio-init:
    image: minio/mc:latest
    container_name: comercial360-dev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-comercial360-files} &&
      echo 'Bucket ready'
      "
    networks:
      - dev-network

  # ==========================================================
  # 3. DEPENDENCIAS DEL WORKSPACE (UNA SOLA VEZ, ANTES DE LOS DEV SERVERS)
  # ==========================================================
  # Instala el workspace pnpm completo en volúmenes propios, para que backend y
  # frontend no compitan escribiendo node_modules ni usen los del host.
  deps:
    image: node:22-alpine
    container_name: comercial360-dev-deps
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install --frozen-lockfile"
    volumes: &workspace_volumes
      - ./:/workspace
      - root_node_modules:/workspace/node_modules
      - backend_node_modules:/workspace/app/backend/node_modules
      - frontend_node_modules:/workspace/app/frontend/node_modules
    networks:
      - dev-network

  # ==========================================================
  # 4. BACKEND NESTJS (nest start --watch)
  # ==========================================================
  backend:
    image: node:22-alpine
    container_name: comercial360-dev-backend
    restart: unless-stopped
    working_dir: /workspace/app/backend
    command: sh -c "corepack enable && pnpm run migration:run && pnpm run start:dev"
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DB_NAME:-comercial360_db}
      DATABASE_USER: ${DB_USER:-postgres}
      DATABASE_PASSWORD: ${DB_PASSWORD:-postgres}
      DATABASE_SSL: "false"
      # Solo para desarrollo; producción exige su propio secreto
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-not-for-production-0000}
      # El navegador entra por Vite (5173), que reenvía /api al backend
      BETTER_AUTH_URL: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      SWAGGER_ENABLED: "true"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      AWS_S3_BUCKET_NAME: ${S3_BUCKET:-comercial360-files}
      AWS_S3_BUCKET: ${S3_BUCKET:-comercial360-files}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-comercial360-dev}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes: *workspace_volumes
    networks:
      - dev-network

  # ==========================================================
  # 5. FRONTEND REACT + VITE (HMR)
  # ==========================================================
  frontend:
    image: node:22-alpine
    container_name: comercial360-dev-frontend
    restart: unless-stopped
    working_dir: /workspace/app/frontend
    command: sh -c "corepack enable && pnpm exec vite --host 0.0.0.0 --port 5173"
    depends_on:
      deps:
        condition: service_completed_successfully
      backend:
        condition: service_started
    environment:
      VITE_PROXY_TARGET: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes: *workspace_volumes
    networks:
      - dev-network

# ==========================================================
# VOLÚMENES PERSISTENTES Y CACHÉ DE DEPENDENCIAS
# ==========================================================
volumes:
  pgdata_dev:
  miniodata_dev:
  root_node_modules:
  backend_node_modules:
  frontend_node_modules:

# ==========================================================
# RED PRIVADA DE DESARROLLO
# ==========================================================
networks:
  dev-network:
    driver: bridge
