# ==============================================================================
# DOCKER COMPOSE - ENTORNO DE DESARROLLO ACTIVO (HOT RELOAD)
# ==============================================================================
# Uso: docker compose -f docker-compose.dev.yml up --build
# Propósito: Permite desarrollar en vivo con recarga automática (HMR) tanto en
# el backend NestJS como en el frontend React Vite mediante volúmenes enlazados.
# ==============================================================================

name: comercial360-dev

services:

  # ==========================================================
  # 1. BASE DE DATOS POSTGRESQL (DESARROLLO LOCAL)
  # ==========================================================
  postgres:
    image: postgres:16-alpine
    container_name: comercial360-dev-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./docker:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${DB_NAME:-comercial360_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-comercial360_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev-network

  # ==========================================================
  # 2. ALMACENAMIENTO S3 LOCAL (MINIO)
  # ==========================================================
  minio:
    image: minio/minio:latest
    container_name: comercial360-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Consola Web MinIO
    volumes:
      - miniodata_dev:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev-network

  # Inicializador automático del bucket privado en MinIO
  minio-init:
    image: minio/mc:latest
    container_name: comercial360-dev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-comercial360-files} &&
      echo 'Bucket ready'
      "
    networks:
      - dev-network

  # ==========================================================
  # 3. BACKEND NESTJS (MODO DESARROLLO CON HOT-RELOAD)
  # ==========================================================
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: comercial360-dev-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-comercial360_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSL: "false"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me-please-32chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5173}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-comercial360-files}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-comercial360-dev}
    ports:
      - "3000:3000"
    volumes:
      - ./app/backend:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules
    networks:
      - dev-network

  # ==========================================================
  # 4. FRONTEND REACT + VITE (SERVIDOR DE DESARROLLO EN VIVO)
  # ==========================================================
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: comercial360-dev-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: http://backend:3000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./app/frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - dev-network

# ==========================================================
# VOLÚMENES PERSISTENTES Y CACHÉ DE DEPENDENCIAS
# ==========================================================
volumes:
  pgdata_dev:
  miniodata_dev:
  backend_node_modules:
  frontend_node_modules:

# ==========================================================
# RED PRIVADA DE DESARROLLO
# ==========================================================
networks:
  dev-network:
    driver: bridge
