# Scheme of the original request: the external proxy's header if present
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads: evidence files (10 MB max) and CSV/Excel imports
  client_max_body_size 15m;

  # API and Swagger go to the backend container
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Respect the scheme seen by the external proxy (TLS ends there)
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Hashed assets: long cache
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
