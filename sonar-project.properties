sonar.organization=maru-rc
sonar.projectKey=Maru-rc_proyecto-comercial360
sonar.projectName=Comercial 360

# Only the backend is analyzed; the frontend is out of scope
sonar.sources=app/backend/src
sonar.tests=app/backend/src,app/backend/test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Vitest coverage (lcov)
sonar.javascript.lcov.reportPaths=app/backend/coverage/lcov.info
sonar.coverage.exclusions=app/backend/src/main.ts,**/*.module.ts,**/data-source.ts,**/migrations/**,**/seeds/**
sonar.cpd.exclusions=**/migrations/**
