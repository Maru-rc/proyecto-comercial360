sonar.organization=maru-rc
sonar.projectKey=Maru-rc_proyecto-comercial360
sonar.projectName=Comercial 360

# Only the backend is analyzed; the frontend is out of scope
sonar.sources=app/backend/src
sonar.tests=app/backend/src,app/backend/test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Vitest coverage (lcov)
sonar.javascript.lcov.reportPaths=app/backend/coverage/lcov.info
# Coverage focuses on the testable core (domain + application). Adapters excluded by design:
# controllers, DTOs, guards, decorators, filters (presentation wiring) and infrastructure (TypeORM/S3/auth adapters),
# matching the project rule that use cases are unit-tested via in-memory repositories without DB/HTTP.
sonar.coverage.exclusions=app/backend/src/main.ts,**/*.module.ts,**/data-source.ts,**/migrations/**,**/seeds/**,**/*.orm-entity.ts,**/*.controller.ts,**/*.dto.ts,**/*.decorator.ts,**/*.guard.ts,**/*.filter.ts,**/infrastructure/**
sonar.cpd.exclusions=**/migrations/**
