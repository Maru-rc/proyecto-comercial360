name: SonarQube

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'sonar-project.properties'
      - '.github/workflows/sonarqube.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - 'sonar-project.properties'
      - '.github/workflows/sonarqube.yml'

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile --filter backend

      - name: Run backend tests with coverage
        run: pnpm --filter backend exec vitest run --coverage --coverage.include='src/**/*.ts' --coverage.reporter=lcov --coverage.reporter=text

      # Vitest writes lcov paths relative to backend/; SonarQube resolves them from the repo root
      - name: Fix coverage paths
        run: sed -i 's|^SF:src/|SF:backend/src/|' backend/coverage/lcov.info

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
