name: PR Size Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  size-label:
    name: Label PR by change size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pascalgn/size-label-action@v0.5.7
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          IGNORED: |
            pnpm-lock.yaml
            package-lock.json
            **/*.docx
            **/*.md
        with:
          sizes: >
            {
              "0": "XS",
              "20": "S",
              "100": "M",
              "300": "L",
              "600": "XL"
            }
